<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>波の重ね合わせシミュレーター</title>
  <link rel="stylesheet" href="wave-superposition.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-top">
        <a class="back-link" href="../index.html">一覧へ戻る</a>
        <span class="eyebrow">波動 / 波の伝わり方</span>
      </div>
      <h1>波の重ね合わせシミュレーター</h1>
      <p class="lead">2つの波が重なると、その場所での変位が足し合わされます。</p>
    </header>

    <div class="app">
      <nav class="preset-list" aria-label="プリセット">
        <button class="preset-btn active" type="button" data-preset="standing" aria-pressed="true">
          <strong>定在波</strong><span>逆向き・同じ振動数</span>
        </button>
        <button class="preset-btn" type="button" data-preset="beats" aria-pressed="false">
          <strong>うなり</strong><span>同じ向き・少し違う振動数</span>
        </button>
        <button class="preset-btn" type="button" data-preset="cancel" aria-pressed="false">
          <strong>完全に打ち消す</strong><span>同じ向き・逆位相</span>
        </button>
      </nav>

      <section class="stage" aria-label="シミュレーション">
        <div class="canvas-wrap">
          <canvas id="waveCanvas" aria-label="2つの進行波と合成波のアニメーション"></canvas>
          <div id="probeHandle" class="probe-handle" role="slider" tabindex="0" aria-label="注目点の位置" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="12" aria-valuenow="6" aria-valuetext="x = 6.00"></div>
        </div>

        <section class="control-dock" aria-label="操作パネル">
          <div class="playback-row">
            <div class="transport">
              <div class="button-group">
                <button id="playBtn" class="primary play-button" type="button"><span class="icon play-icon" aria-hidden="true"></span><span id="playLabel">再生</span></button>
                <button id="resetBtn" class="icon-button" type="button" aria-label="先頭に戻す" title="現在の条件のまま先頭に戻す"><span class="icon reset-icon" aria-hidden="true"></span></button>
              </div>
              <div class="button-group">
                <button id="stepBackBtn" class="icon-button" type="button" aria-label="1コマ戻す" title="1コマ戻す"><span class="icon step-back-icon" aria-hidden="true"></span></button>
                <button id="stepForwardBtn" class="icon-button" type="button" aria-label="1コマ進める" title="1コマ進める"><span class="icon step-forward-icon" aria-hidden="true"></span></button>
              </div>
              <div class="button-group">
                <button id="backBtn" class="icon-button" type="button" aria-label="逆再生" title="逆再生" aria-pressed="false"><span class="icon reverse-icon" aria-hidden="true"></span></button>
                <button id="forwardBtn" class="icon-button" type="button" aria-label="順再生" title="順再生" aria-pressed="false"><span class="icon forward-icon" aria-hidden="true"></span></button>
              </div>
            </div>
            <output id="timeValue" class="time-value" aria-label="時刻">t = 0.00 s</output>
            <div class="toggle-row" aria-label="表示する波">
              <button id="showWave1Btn" class="switch-btn wave1 active" type="button" role="switch" aria-checked="true">進行波1</button>
              <button id="showWave2Btn" class="switch-btn wave2 active" type="button" role="switch" aria-checked="true">進行波2</button>
              <button id="showSumBtn" class="switch-btn sum active" type="button" role="switch" aria-checked="true">合成波</button>
              <button id="showEnvelopeBtn" class="switch-btn envelope" type="button" role="switch" aria-checked="false">包絡線</button>
            </div>
          </div>

          <div class="param-grid">
            <div class="param-head" aria-hidden="true">
              <span></span><span>振幅</span><span>振動数</span><span>速度</span><span>位相</span>
            </div>
            <div class="wave-row">
              <div class="wave-name wave1">進行波1</div>
              <div class="mini-control wave1" data-label="振幅">
                <input id="amp1Range" aria-label="進行波1の振幅" type="range" min="0" max="1.2" step="0.05" value="0.5" />
                <input id="amp1Number" aria-label="進行波1の振幅の数値" type="number" min="0" max="1.2" step="0.05" value="0.5" />
              </div>
              <div class="mini-control wave1" data-label="振動数">
                <input id="freq1Range" aria-label="進行波1の振動数" type="range" min="0.1" max="2.4" step="0.025" value="0.4" />
                <input id="freq1Number" aria-label="進行波1の振動数の数値" type="number" min="0.1" max="2.4" step="0.025" value="0.4" />
              </div>
              <div class="mini-control wave1" data-label="速度">
                <input id="vel1Range" aria-label="進行波1の速度" type="range" min="-4" max="4" step="0.1" value="2.4" />
                <input id="vel1Number" aria-label="進行波1の速度の数値" type="number" min="-4" max="4" step="0.1" value="2.4" />
              </div>
              <button id="invertWave1Btn" class="phase-button" type="button" aria-label="進行波1を逆位相にする">逆位相</button>
            </div>
            <div class="wave-row">
              <div class="wave-name wave2">進行波2</div>
              <div class="mini-control wave2" data-label="振幅">
                <input id="amp2Range" aria-label="進行波2の振幅" type="range" min="0" max="1.2" step="0.05" value="0.5" />
                <input id="amp2Number" aria-label="進行波2の振幅の数値" type="number" min="0" max="1.2" step="0.05" value="0.5" />
              </div>
              <div class="mini-control wave2" data-label="振動数">
                <input id="freq2Range" aria-label="進行波2の振動数" type="range" min="0.1" max="2.4" step="0.025" value="0.4" />
                <input id="freq2Number" aria-label="進行波2の振動数の数値" type="number" min="0.1" max="2.4" step="0.025" value="0.4" />
              </div>
              <div class="mini-control wave2" data-label="速度">
                <input id="vel2Range" aria-label="進行波2の速度" type="range" min="-4" max="4" step="0.1" value="-2.4" />
                <input id="vel2Number" aria-label="進行波2の速度の数値" type="number" min="-4" max="4" step="0.1" value="-2.4" />
              </div>
              <button id="invertWave2Btn" class="phase-button" type="button" aria-label="進行波2を逆位相にする">逆位相</button>
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>
  <script src="wave-superposition.js"></script>
</body>
</html>
